name: Daily Telegram Form Reminder

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        run: |
          MSG="Daily Form Reminder: Please fill in your form!"$'\n\n'"https://docs.google.com/forms/d/e/1FAIpQLSfyLmtWWWpcghI7AKaQwff_JuE9Ynmy7-F7thOgKNcj_qTexg/viewform?usp=dialog"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MSG"
